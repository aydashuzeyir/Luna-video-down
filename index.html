
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Video Down</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
            --card-bg: rgba(24, 34, 27, 0.75);
            --accent-color: #ec4899;
            --text-color: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body.theme-cyber {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --accent-color: #ec4899;
        }
        body.theme-sunset {
            --bg-gradient: linear-gradient(135deg, #1c1917 0%, #291515 50%, #451a03 100%);
            --accent-color: #f97316;
        }
        body.theme-emerald {
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #022c22 100%);
            --accent-color: #10b981;
        }
        body.theme-ocean {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0369a1 50%, #082f49 100%);
            --accent-color: #38bdf8;
        }
        body.theme-purple {
            --bg-gradient: linear-gradient(135deg, #2e1065 0%, #581c87 50%, #3b0764 100%);
            --accent-color: #c084fc;
        }
        body.theme-crimson {
            --bg-gradient: linear-gradient(135deg, #450a0a 0%, #7f1d1d 50%, #2b0b0b 100%);
            --accent-color: #f87171;
        }

        body.font-jakarta { --font-family: 'Plus Jakarta Sans', sans-serif; }
        body.font-poppins { --font-family: 'Poppins', sans-serif; }
        body.font-inter { --font-family: 'Inter', sans-serif; }
        body.font-rubik { --font-family: 'Rubik', sans-serif; }
        body.font-mono { --font-family: 'JetBrains Mono', monospace; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            transition: 0.4s ease;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 4px;
        }

        .settings-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13px;
        }

        .setting-group label {
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 12px;
        }

        .options-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .t-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .t-btn:hover, .t-btn.active {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .search-container {
            display: flex;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            align-items: center;
        }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            width: 100%;
            outline: none;
        }

        .search-container button {
            background: var(--accent-color);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .search-container button:hover {
            opacity: 0.9;
        }

        /* Video və Endirmə Nəticə Paneli */
        .download-result-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .download-result-card.active {
            display: block;
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .download-options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .download-opt-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: 0.2s;
        }

        .download-opt-btn:hover {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.12);
        }

        .section-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .social-icon {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-icon:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .social-icon span {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .ic-google { background: rgba(66, 133, 244, 0.15); color: #4285f4; }
        .ic-spotify { background: rgba(29, 185, 84, 0.15); color: #1db954; }
        .ic-fb { background: rgba(24, 119, 242, 0.15); color: #1877f2; }
        .ic-x { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .ic-pinterest { background: rgba(189, 8, 28, 0.15); color: #bd081c; }
        .ic-insta { background: rgba(225, 48, 108, 0.15); color: #e1306c; }
        .ic-threads { background: rgba(255, 255, 255, 0.1); color: #ffffff; }

        .info-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body class="theme-cyber font-jakarta">

    <header>
        <h1>Luna Video Down</h1>
        <p>Media & Music Downloader</p>
    </header>

    <div class="settings-panel">
        <div class="setting-group">
            <label>Fon Temaları:</label>
            <div class="options-grid" id="themeOptions">
                <button class="t-btn active" onclick="setTheme('cyber', this)">Neon</button>
                <button class="t-btn" onclick="setTheme('sunset', this)">Sunset</button>
                <button class="t-btn" onclick="setTheme('emerald', this)">Emerald</button>
                <button class="t-btn" onclick="setTheme('ocean', this)">Ocean</button>
                <button class="t-btn" onclick="setTheme('purple', this)">Purple</button>
                <button class="t-btn" onclick="setTheme('crimson', this)">Crimson</button>
            </div>
        </div>

        <div class="setting-group" style="border-top: 1px solid var(--border-color); padding-top: 10px;">
            <label>Yazı Fontları:</label>
            <div class="options-grid" id="fontOptions">
                <button class="t-btn active" onclick="setFont('jakarta', this)">Jakarta</button>
                <button class="t-btn" onclick="setFont('poppins', this)">Poppins</button>
                <button class="t-btn" onclick="setFont('inter', this)">Inter</button>
                <button class="t-btn" onclick="setFont('rubik', this)">Rubik</button>
                <button class="t-btn" onclick="setFont('mono', this)">Mono</button>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="urlInput" placeholder="Google-da mahnı axtar və ya link yapışdır...">
        <button onclick="handleDownload()">Endir</button>
    </div>

    <div class="download-result-card" id="resultCard">
        <div class="result-title">Endirmə Seçimləri:</div>
        <div class="download-options-list" id="resultList">
            </div>
    </div>

    <div class="section-title">Dəstəklənən Mənbələr</div>
    <div class="social-grid">
        <a href="https://www.google.com" target="_blank" class="social-icon">
            <span class="ic-google">🌐</span> Google Axtarış
        </a>
        <a href="https://open.spotify.com" target="_blank" class="social-icon">
            <span class="ic-spotify">🎵</span> Spotify Musiqi
        </a>
        <a href="https://www.facebook.com" target="_blank" class="social-icon">
            <span class="ic-fb">👥</span> Facebook
        </a>
        <a href="https://twitter.com" target="_blank" class="social-icon">
            <span class="ic-x">✖</span> X (Twitter)
        </a>
        <a href="https://www.pinterest.com" target="_blank" class="social-icon">
            <span class="ic-pinterest">📌</span> Pinterest
        </a>
        <a href="https://www.instagram.com" target="_blank" class="social-icon">
            <span class="ic-insta">📸</span> Instagram
        </a>
        <a href="https://www.threads.net" target="_blank" class="social-icon">
            <span class="ic-threads">🧵</span> Threads
        </a>
    </div>

    <div class="info-card">
        İstədiyiniz musiqini və ya videonu tapmaq üçün Google üzərindən axtarın və ya link daxil edin.
    </div>

    <script>
        function setTheme(themeName, btn) {
            document.body.classList.remove('theme-cyber', 'theme-sunset', 'theme-emerald', 'theme-ocean', 'theme-purple', 'theme-crimson');
            document.body.classList.add('theme-' + themeName);
            document.querySelectorAll('#themeOptions .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setFont(fontName, btn) {
            document.body.classList.remove('font-jakarta', 'font-poppins', 'font-inter', 'font-rubik', 'font-mono');
            document.body.classList.add('font-' + fontName);
            document.querySelectorAll('#fontOptions .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleDownload() {
            const val = document.getElementById('urlInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const resultList = document.getElementById('resultList');

            if(!val) {
                window.open('https://www.google.com', '_blank');
                return;
            }

            if(val.startsWith('http')) {
                // Link daxil edildikdə endirmə paneli göstər
                resultCard.classList.add('active');
                resultList.innerHTML = `
                    <a href="${val}" target="_blank" class="download-opt-btn">
                        <span>📥 Videonu/Faylı Birbaşa Aç & Endir</span>
                        <span>➔</span>
                    </a>
                    <a href="https://www.google.com/search?q=${encodeURIComponent(val)}" target="_blank" class="download-opt-btn">
                        <span>🔍 Google-da Axtar</span>
                        <span>➔</span>
                    </a>
                `;
            } else {
                // Mətn daxil edildikdə Google axtarışı aç
                window.open('https://www.google.com/search?q=' + encodeURIComponent(val), '_blank');
            }
        }
    </script>
</body>
</html>
